<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Kounen through an accessible, keyboard-friendly contact form.">
  <meta name="author" content="Kounen">
  <title>Contact | Kounen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html" aria-label="Kounen home">Kounen</a>
    <nav aria-label="Primary navigation">
      <ul class="nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a aria-current="page" href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main-content">
  <section class="section" aria-labelledby="contact-title">
    <div class="container narrow">
      <p class="eyebrow">Get in touch</p>
      <h1 id="contact-title">Contact me</h1>
      <p>Use the form below to send a message.</p>

      <form id="contact-form" class="contact-form" action="#" method="post" novalidate>
        <div class="form-group">
          <label for="name">Full name <span aria-hidden="true">*</span></label>
          <input id="name" name="name" type="text" autocomplete="name" required aria-required="true">
          <small id="name-help">Enter your full name.</small>
        </div>

        <div class="form-group">
          <label for="email">Email address <span aria-hidden="true">*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-required="true" aria-describedby="email-help">
          <small id="email-help">Example: name@example.com</small>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="message">Message <span aria-hidden="true">*</span></label>
          <textarea id="message" name="message" rows="6" required aria-required="true"></textarea>
        </div>

        <button class="button" type="submit">Send message</button>
        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container"><p>&copy; 2026 Kounen.</p></div>
</footer>
<script src="script.js" defer></script>
</body>
</html>
